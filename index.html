<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OPPORTUNITIES</title>
  <meta name="description" content="OPPORTUNITIES — oportunități egale pentru fiecare adolescent din Moldova. Ateliere, voluntariat, Erasmus+, burse și evenimente, chiar dacă locuiești departe de marele oraș.">
  <meta name="theme-color" content="#6b4fc4">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#app" data-i18n="skip">Sari la conținut</a>

  <header class="header">
    <div class="wrap header__bar">
      <a class="logo" href="#/" aria-label="OPPORTUNITIES">
        <span class="logo__mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="logo__word">OPPORTUNITIES</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="" data-i18n="nav.home">Acasă</a>
        <a href="#/explore" data-nav="explore" data-i18n="nav.explore">Explorează oportunități</a>
        <a href="#/regions" data-nav="regions" data-i18n="nav.regions">Regiuni</a>
        <a href="#/map" data-nav="map" data-i18n="nav.map">Hartă</a>
        <a href="#/events" data-nav="events" data-i18n="nav.events">Evenimente</a>
        <a href="#/about" data-nav="about" data-i18n="nav.about">Despre noi</a>
        <a href="#/contact" data-nav="contact" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="header__tools">
        <div class="lang" role="group" data-i18n-aria="lang.label" aria-label="Limba">
          <button type="button" data-lang="ro" aria-pressed="true">RO</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="btn btn--primary btn--sm header__share" href="#/share" data-nav="share">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="share.btn">Propune o oportunitate</span>
        </a>
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu" data-i18n-aria="nav.menu" aria-label="Meniu">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="menu" id="menu" hidden>
    <div class="menu__scrim" id="menu-scrim"></div>
    <nav class="menu__sheet" aria-label="Mobile">
      <button class="icon-btn menu__close" id="menu-close" type="button" data-i18n-aria="nav.close" aria-label="Închide">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <a href="#/" data-nav="" data-i18n="nav.home">Acasă</a>
      <a href="#/explore" data-nav="explore" data-i18n="nav.explore">Explorează oportunități</a>
      <a href="#/regions" data-nav="regions" data-i18n="nav.regions">Regiuni</a>
      <a href="#/map" data-nav="map" data-i18n="nav.map">Hartă</a>
      <a href="#/events" data-nav="events" data-i18n="nav.events">Evenimente</a>
      <a href="#/about" data-nav="about" data-i18n="nav.about">Despre noi</a>
      <a href="#/contact" data-nav="contact" data-i18n="nav.contact">Contact</a>
      <a class="btn btn--primary btn--block" href="#/share" data-i18n="share.btn">Propune o oportunitate</a>
    </nav>
  </div>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap footer__grid">
      <div class="footer__brand">
        <a class="logo logo--light" href="#/" aria-label="OPPORTUNITIES">
          <span class="logo__mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="logo__word">OPPORTUNITIES</span>
        </a>
        <p data-i18n="footer.mission"></p>
        <div data-social></div>
      </div>
      <div>
        <h2 class="footer__h" data-i18n="footer.explore"></h2>
        <a href="#/explore" data-i18n="nav.explore"></a>
        <a href="#/regions" data-i18n="nav.regions"></a>
        <a href="#/map" data-i18n="nav.map"></a>
        <a href="#/events" data-i18n="nav.events"></a>
      </div>
      <div>
        <h2 class="footer__h" data-i18n="footer.platform"></h2>
        <a href="#/about" data-i18n="nav.about"></a>
        <a href="#/share" data-i18n="share.btn"></a>
      </div>
      <div>
        <h2 class="footer__h" data-i18n="footer.contact"></h2>
        <a href="#/contact" data-i18n="footer.contactForm"></a>
        <span class="footer__muted">Moldova</span>
      </div>
    </div>
    <div class="wrap footer__bottom">
      <p class="footer__note" data-i18n="footer.note"></p>
      <p>© <span id="year"></span> OPPORTUNITIES · <span data-i18n="footer.made"></span></p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">OPPORTUNITIES needs JavaScript to show opportunities. / Activați JavaScript pentru a vedea oportunitățile.</p></noscript>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/moldova-outline.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
